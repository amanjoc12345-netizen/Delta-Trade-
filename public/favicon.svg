<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="deltaGrad" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="deltaInner" x1="16" y1="36" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Delta Wing -->
  <path d="M24 6L43 41H5L24 6Z" stroke="url(#deltaGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Inner Dynamic Triangular Core -->
  <path d="M24 17L35 36H13L24 17Z" fill="url(#deltaInner)" opacity="0.9" />
  <path d="M19 30L29 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" />
